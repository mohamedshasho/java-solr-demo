# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=solr-ecommerce-demo
server.port=8080

# ===================================================================
# Apache Solr 10 Configuration
# ===================================================================
# Base URL pointing to the running Solr instance
solr.base-url=http://localhost:8983/solr
# Name of the core used for storing indexed products
solr.core-name=products

# ===================================================================
# H2 In-Memory Database Configuration (Relational Store for Full Details)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:solrdemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Accessible at http://localhost:8080/h2-console for live presentation)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# Spring Data JPA & Hibernate
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===================================================================
# Demo Data Seeder Configuration (+5000 Products)
# ===================================================================
# Automatically seed 5000+ realistic bilingual products into DB & Solr on application startup
app.seeder.auto-seed-on-startup=true
app.seeder.target-count=5000
app.seeder.batch-size=500